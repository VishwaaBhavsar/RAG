[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-framework"
version = "0.0.0"
description = "Reusable, extensible, plugin-based AI RAG framework"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "PyYAML>=6,<7",
  "pypdf>=6,<7",
  "chromadb>=0.5,<2",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3,<6",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_framework"]

[tool.mypy]
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages/core/src", "packages/plugins/src", "packages/providers/src"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
  "integration: slow tests that use real external/local models or heavier dependencies",
]
